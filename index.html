<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Pay VIP</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f4f6ff,#e8ebff);display:flex;align-items:center;justify-content:center;padding:20px}.container{width:100%;max-width:420px;background:#fff;padding:28px 22px;border-radius:18px;box-shadow:0 10px 35px #0002}.logo{text-align:center;font-size:30px;font-weight:800}.sub{text-align:center;color:#777;font-size:13px;margin:6px 0 25px}.tabs{display:flex;border-bottom:1px solid #ddd;margin-bottom:20px}.tab{width:50%;padding:12px;border:0;background:none;font-size:16px;font-weight:bold}.tab.active{color:#4b4cff;border-bottom:3px solid #4b4cff}.form{display:none}.form.active{display:block}label{display:block;margin:14px 0 7px;font-size:14px;font-weight:600}input{width:100%;padding:13px;border:1px solid #d5d5d5;border-radius:9px;font-size:15px}.otp{display:flex;gap:8px}.otp input{flex:1}.otp button{min-width:105px;border:0;border-radius:9px;background:#4b4cff;color:#fff;font-weight:bold}.otp button:disabled{background:#aaa}.check{display:flex;align-items:center;gap:8px;font-size:13px}.check input{width:auto}.main{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#4b4cff;color:#fff;font-size:16px;font-weight:bold}.links{display:flex;justify-content:space-between;margin-top:15px;font-size:13px}.links a{color:#4b4cff}.msg{text-align:center;margin-top:12px;min-height:20px}.ver{text-align:center;margin-top:24px;color:#888;font-size:12px}</style></head><body><div class="container"><div class="logo">Link Pay VIP</div><div class="sub">Secure Account Access</div><div class="tabs"><button class="tab active" onclick="show('login',this)">Sign In</button><button class="tab" onclick="show('register',this)">Sign Up</button></div><div id="login" class="form active"><label>Phone Number</label><input type="tel" placeholder="+91 Phone Number" maxlength="13"><label>6-Digit PIN</label><input type="password" placeholder="6-digit PIN" maxlength="6" inputmode="numeric"><label class="check"><input type="checkbox"> Remember Me</label><label class="check"><input type="checkbox"> I agree to the User Privacy Agreement</label><button class="main" type="button">Sign In</button><div class="links"><a href="#">Forgot Password?</a><a href="#" onclick="openReg()">Create Account</a></div></div><div id="register" class="form"><label>User Name</label><input type="text" placeholder="Enter User Name"><label>+91 Phone Number</label><input type="tel" placeholder="+91 Phone Number" maxlength="13"><label>OTP Code</label><div class="otp"><input id="otp" type="text" placeholder="6-digit OTP" maxlength="6" inputmode="numeric"><button id="send" type="button" onclick="sendOtp()">Send OTP</button></div><label>Invite Code</label><input type="text" placeholder="Invite Code"><label class="check"><input type="checkbox"> I agree to the User Privacy Agreement</label><button class="main" type="button" onclick="verify()">Sign Up</button><div id="msg" class="msg"></div></div><div class="ver">Version v1.2.3</div></div><script>function show(id,b){document.querySelectorAll('.form').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}function openReg(){show('register',document.querySelectorAll('.tab')[1])}let t=null;function sendOtp(){if(t)return;let s=60,b=document.getElementById('send'),m=document.getElementById('msg');b.disabled=true;b.textContent=s+'s';m.textContent='OTP request sent.';t=setInterval(()=>{s--;b.textContent=s+'s';if(s<=0){clearInterval(t);t=null;b.disabled=false;b.textContent='Send OTP';m.textContent=''}},1000)}function verify(){let v=document.getElementById('otp').value.trim(),m=document.getElementById('msg');m.textContent=v.length===6?'OTP verification requires server verification.':'Incorrect OTP'}</script></body></html>
